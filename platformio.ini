; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed=115200
lib_deps =
    https://github.com/crankyoldgit/IRremoteESP8266.git

[env:native]
platform = native
test_framework = unity
 
; Pin a tag or commit once you've picked a release (append #<tag-or-sha>).
; A git dependency is used because the host build needs the library's test/
; folder on the include path (see build_flags), and a full clone always has it.
lib_deps =
    https://github.com/crankyoldgit/IRremoteESP8266.git
 
; The library declares itself ESP-only (library.json: platforms espressif8266/
; espressif32), so PlatformIO would skip it on 'native' without this.
lib_compat_mode = off
 
; -DUNIT_TEST: compiles the library without Arduino/GPIO code and makes IRsend's
;   mark()/space() overridable (the test's RecordingSend relies on that).
; -I...: with UNIT_TEST set, library headers include IRsend_test.h from its test/ dir.
build_flags =
    -DUNIT_TEST
    -I.pio/libdeps/native/IRremoteESP8266/test